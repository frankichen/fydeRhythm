services:
  sync-server:
    build: .
    container_name: fyderhythm-sync
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/fyderhythm-sync.db
      LISTEN_ADDR: :8080
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
