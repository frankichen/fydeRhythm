services:
  sync-server:
    build: .
    container_name: fyderhythm-sync
    restart: unless-stopped
    init: true
    read_only: true
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/fyderhythm-sync.db
      LISTEN_ADDR: :8080
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./data:/data
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
