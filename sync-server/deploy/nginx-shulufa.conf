server {
    listen 80;
    server_name shulufa.555044.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 2443 ssl http2;
    server_name shulufa.555044.xyz;

    ssl_certificate     /etc/nginx/ssl/letsencrypt/live/555044.xyz/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/letsencrypt/live/555044.xyz/privkey.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://fyderhythm-sync:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }
}
