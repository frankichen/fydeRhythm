name: Build DeepSeek IME

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/deepseek-ime
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y automake libtool cmake ninja-build unzip

      - name: Cache Emscripten SDK and librime build
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/emsdk
            ${{ runner.temp }}/librime-wasm/wasm-builder/dl-cache
            ${{ runner.temp }}/librime-wasm/wasm-builder/dep/build
          key: librime-wasm-emsdk-3.1.45-v1

      - name: Install Emscripten SDK
        shell: bash
        run: |
          if [ ! -d "${RUNNER_TEMP}/emsdk/.git" ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git "${RUNNER_TEMP}/emsdk"
          fi
          cd "${RUNNER_TEMP}/emsdk"
          ./emsdk install 3.1.45
          ./emsdk activate 3.1.45

      - name: Build librime WebAssembly engine
        shell: bash
        run: |
          if [ ! -d "${RUNNER_TEMP}/librime-wasm/.git" ]; then
            git clone --depth 1 https://github.com/FydeOS/librime-wasm.git "${RUNNER_TEMP}/librime-wasm"
          else
            git -C "${RUNNER_TEMP}/librime-wasm" reset --hard
            git -C "${RUNNER_TEMP}/librime-wasm" pull --ff-only
          fi
          source "${RUNNER_TEMP}/emsdk/emsdk_env.sh"
          cd "${RUNNER_TEMP}/librime-wasm"
          ./wasm-builder/download-plugins
          ./wasm-builder/dep/build-all
          ./wasm-builder/build-wasm
          cp cmake-build-wasm/bin/rime_emscripten.js "${GITHUB_WORKSPACE}/entrypoints/background/rime_emscripten.js"
          cp cmake-build-wasm/bin/rime_emscripten.wasm "${GITHUB_WORKSPACE}/public/rime_emscripten.wasm"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm compile
      - run: pnpm test
      - run: pnpm build
      - name: Package extension
        run: cd build/chrome-mv3 && zip -r ../../fydeRhythm-deepseek-ime.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: fydeRhythm-deepseek-ime
          path: fydeRhythm-deepseek-ime.zip
          retention-days: 14
