name: Build DeepSeek IME

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/deepseek-ime
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y automake libtool cmake ninja-build unzip

      - name: Cache Emscripten SDK and librime build
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/emsdk
            ${{ runner.temp }}/librime-wasm/wasm-builder/dl-cache
          key: librime-wasm-emsdk-3.1.36-v6

      - name: Install Emscripten SDK
        shell: bash
        run: |
          if [ ! -d "${RUNNER_TEMP}/emsdk/.git" ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git "${RUNNER_TEMP}/emsdk"
          fi
          cd "${RUNNER_TEMP}/emsdk"
          ./emsdk install 3.1.36
          ./emsdk activate 3.1.36

      - name: Build librime WebAssembly engine
        shell: bash
        run: |
          rm -rf "${RUNNER_TEMP}/librime-wasm"
          git clone https://github.com/FydeOS/librime-wasm.git "${RUNNER_TEMP}/librime-wasm"
          git -C "${RUNNER_TEMP}/librime-wasm" checkout cf09ae07bb3797d96ffe253415dad9b89e730a5d

          source "${RUNNER_TEMP}/emsdk/emsdk_env.sh"
          cd "${RUNNER_TEMP}/librime-wasm"

          # The upstream 2023 CI was built with emsdk 3.1.36. Keep the toolchain pinned
          # and avoid today's glog master, which is no longer compatible with this tree.
          sed -i '/build-glog/d' wasm-builder/dep/build-all
          sed -i 's/-DENABLE_LOGGING=on/-DENABLE_LOGGING=off/' wasm-builder/build-wasm

          # This pinned librime revision declares a glog-only helper outside its feature
          # guard. Wrap it so ENABLE_LOGGING=off is a valid build configuration.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/rime/setup.cc")
          text = path.read_text()
          old = '''void PrefixAttacher(std::ostream &s, const google::LogMessageInfo &l, void* data) {
            s << l.severity[0]
              << std::setw(2) << l.time.hour() << ':'
              << std::setw(2) << l.time.min()  << ':'
              << std::setw(2) << l.time.sec() << "."
              << std::setw(3) << l.time.usec() / 1000
              << ' '
              << l.filename << ':' << l.line_number << "]";
          }
          '''
          new = '''#ifdef RIME_ENABLE_LOGGING
          void PrefixAttacher(std::ostream &s, const google::LogMessageInfo &l, void* data) {
            s << l.severity[0]
              << std::setw(2) << l.time.hour() << ':'
              << std::setw(2) << l.time.min()  << ':'
              << std::setw(2) << l.time.sec() << "."
              << std::setw(3) << l.time.usec() / 1000
              << ' '
              << l.filename << ':' << l.line_number << "]";
          }
          #endif  // RIME_ENABLE_LOGGING
          '''
          if old not in text:
              raise SystemExit("setup.cc logging helper pattern not found")
          path.write_text(text.replace(old, new))
          PY

          # The browser wrapper uses LOG() directly. With logging disabled, use
          # librime's built-in no-op macros instead of the unavailable glog header.
          sed -i 's|#include <glog/logging.h>|#include <rime/no_logging.h>|' tools/rime_emscripten.cpp
          grep -q '#include <rime/no_logging.h>' tools/rime_emscripten.cpp

          # Native CPU flags add -march=native, which is invalid for the wasm32 target.
          sed -i 's/ --enable-native-code / /' wasm-builder/dep/build-marisa

          # The original Boost JFrog URL is retired. Preload the official archive and
          # verify the checksum published for Boost 1.77.0.
          mkdir -p wasm-builder/dl-cache
          rm -f wasm-builder/dl-cache/boost-1.77.0.tar.gz
          curl --fail --location --retry 3 \
            https://archives.boost.io/release/1.77.0/source/boost_1_77_0.tar.gz \
            --output wasm-builder/dl-cache/boost-1.77.0.tar.gz
          echo "5347464af5b14ac54bb945dc68f1dd7c56f0dad7262816b956138fc53bcc0131  wasm-builder/dl-cache/boost-1.77.0.tar.gz" | sha256sum --check

          ./wasm-builder/download-plugins
          ./wasm-builder/dep/build-all
          ./wasm-builder/build-wasm
          cp cmake-build-wasm/bin/rime_emscripten.js "${GITHUB_WORKSPACE}/entrypoints/background/rime_emscripten.js"
          cp cmake-build-wasm/bin/rime_emscripten.wasm "${GITHUB_WORKSPACE}/public/rime_emscripten.wasm"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm compile
      - run: pnpm test
      - run: pnpm build
      - name: Package extension
        run: cd build/chrome-mv3 && zip -r ../../fydeRhythm-deepseek-ime.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: fydeRhythm-deepseek-ime
          path: fydeRhythm-deepseek-ime.zip
          retention-days: 14
