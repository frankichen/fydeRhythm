name: ChromeOS Personal Sync CI

on:
  push:
    branches:
      - feature/chromeos-personal-sync
    paths:
      - 'entrypoints/**'
      - 'lib/**'
      - 'tests/**'
      - 'release-patches/chromeos-personal-sync/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'wxt.config.ts'
      - '.github/workflows/chromeos-personal-sync.yml'
  pull_request:
    paths:
      - 'entrypoints/**'
      - 'lib/**'
      - 'tests/**'
      - 'release-patches/chromeos-personal-sync/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'wxt.config.ts'
      - '.github/workflows/chromeos-personal-sync.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm compile
      - name: Unit tests
        run: pnpm test
      - name: Release patch syntax
        run: |
          mkdir -p /tmp/fyderhythm-runtime-patches
          tar -xzf release-patches/chromeos-personal-sync/runtime-patches.tar.gz -C /tmp/fyderhythm-runtime-patches
          for file in personal-sync.js personal-sync-options.js ai-reranker.js ai-options.js; do
            test -f "/tmp/fyderhythm-runtime-patches/$file"
            node --check "/tmp/fyderhythm-runtime-patches/$file"
          done
          bash -n release-patches/chromeos-personal-sync/build-preview.sh
      - name: Generated Rime loader status
        run: |
          if [ -f entrypoints/background/rime_emscripten.js ]; then
            echo "Rime loader present; source packaging can be enabled."
          else
            echo "Source validation passed, but rime_emscripten.js is a generated upstream artifact and is not present in this repository."
          fi
